[project]
name = "fortune-backend"
version = "0.1.0"
description = "四柱推命 (Four Pillars of Destiny) API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",           # EmailStr バリデーション
    "sxtwl>=2.0.6",                   # 寿星天文暦: 干支・節入りの天文計算
    "sqlalchemy[asyncio]>=2.0",       # ORM (async)
    "asyncpg>=0.29",                  # PostgreSQL 非同期ドライバ
    "alembic>=1.13",                  # DB マイグレーション
    "pyjwt>=2.8",                     # セッション用 JWT
    "python-multipart>=0.0.9",        # マルチパート（アイコンアップロード）
    "pillow>=10.2",                   # 画像の検証・リサイズ
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",           # TestClient 用
    "ruff>=0.4",
    "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI の `Depends(...)` を引数デフォルトに置くのは公式イディオム
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["sxtwl"]           # 型スタブ・py.typed を持たない C 拡張
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
